name: CI

on:
  push:
    branches: ["v2", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  bot:
    name: Bot, lint and suites

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
            # A throwaway database on a throwaway runner. Real credentials
            # never belong in this file.
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: aesthetic_king_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aesthetic_king_test

      # src/config/env.js refuses to load without these. The suites never call
      # Discord, so placeholder values are enough — but they must exist. They
      # are quoted because an unquoted snowflake is read as a float and arrives
      # as "1.23456789012346E+17".
      TOKEN: ci-placeholder-token
      CLIENT_ID: "123456789012345678"
      DEV_GUILD_ID: "123456789012345678"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      # canvas has no prebuilt binary for every Node ABI, so give node-gyp the
      # system libraries its binding.gyp checks for with pkg-config.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libpixman-1-0 libpixman-1-dev \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # Several suites (asset query, creator profiles, payments, remix, ...)
      # transpile the real Studio TypeScript with the Studio's own esbuild so
      # they assert against shipped code rather than a copy. They resolve it
      # from studio/node_modules, so it has to exist here too.
      - name: Install Studio dependencies
        run: npm ci
        working-directory: studio

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint -- --quiet

      - name: Run all suites
        run: node scripts/runAllTests.js

  studio:
    name: Studio typecheck and build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The VPS deployment target. It uses a different Vite config, a shim in
      # place of `cloudflare:workers`, and no Response Store / CF Images, so
      # it breaks independently of the Workers build above.
      - name: Build (Node)
        run: npm run build:node
